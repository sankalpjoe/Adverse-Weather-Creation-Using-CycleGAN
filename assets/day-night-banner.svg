  <text x="1080" y="57" fill="#e9f1ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">NIGHT</text>
  <text x="600" y="83" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="1">Day ↔ Night</text>
  <text x="600" y="113" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">UNPAIRED IMAGE TRANSLATION WITH CYCLEGAN</text>
